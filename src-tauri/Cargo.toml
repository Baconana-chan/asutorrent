[package]
name = "asutorrent"
version = "1.0.0"
edition = "2021"
description = "BitTorrent client built with Tauri + librqbit + Preact"
authors = ["AsuTorrent"]
license = "MIT"

[package.metadata]
authors = ["AsuTorrent"]
description = "BitTorrent client built with Tauri + librqbit + Preact"
license = "MIT"

[features]
# Headless mode: run without GUI, only web API + scheduler loops
headless = []

[lib]
name = "asutorrent_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-shell = "2"
librqbit = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
chrono = "0.4"
dirs = "5"
log = "0.4"
env_logger = "0.11"
rss = "2"
reqwest = { version = "0.12", features = ["json", "socks"] }
regex = "1"
futures-util = "0.3"
image = "0.25"
axum = "0.7"
tower-http = { version = "0.5", features = ["cors", "fs"] }
maxminddb = { version = "0.30", features = ["mmap"] }
url = "2"
tokio-util = { version = "0.7", features = ["io"] }
if-addrs = "0.12"
async-trait = "0.1"
urlencoding = "2"
arboard = "3"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
